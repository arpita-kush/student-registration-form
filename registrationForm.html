<!DOCTYPE html>
<html>
    <head>
        <title>Student Registration Form </title>
    </head>
    
    <body>
        <h2>Student Registration Form</h2>
        <form action="/action.php">
           <label for="name">Name: </label> 
        <input type="text" placeholder="Name">
        <br>
            Email Id:
            <input type="email" placeholder="email address">
        <br>
            Password: 
            <input type="password" placeholder="password">
        <br>
           Phone: 
           <input type="text" placeholder="phone number">
        <br>
           DOB:
           <input type="text" placeholder="date of birth">
        <br>
           <!--OR-->
           <div>
            <label for="birthdate">birthdate: </label>
            <input type="date" name="birthdate" />
           </div>
        <br>
           <div>
            <label for="appointment time">appointment time: </label>
            <input type="time" name="appointment time" />
           </div>   

        <br>
        <br>
           Gender:
           <label for="male">
           <input type="radio" value="male" name="gender" id="male"> Male         
           </label>
           <label for="female">
            <input type="radio" value="female" name="gender" id="female"> Female
           </label> 
           <label for="other">
            <input type="radio" value="other" name="gender" id="other"> Other
           </label>
         <br>
         <br>
            Class: 
            <select name="class">
                <option value="class IX"> class XI </option>
                <option value="class X"> class X</option>
                <option value="class XI"> class XI</option>
                <option value="class XII"> class XII</option>
            </select>  

            <br>
            <br>
              Subject: 
            <label for="phy">
                <input type="checkbox" value="phy" name="subject" id="101"> Physics
            </label>
            <label for="chem">
                <input type="checkbox" value="chem" name="subject" id="102"> Chemistry
            </label>
            <label for="math">
                <input type="radio" value="math" name="subject" id="103"> Math
            </label>
            <label for="biology">
                <input type="radio" value="biology" name="subject" id="104"> Biology
            </label>
            <label for="cs">
                <input type="checkbox" value="cs" name="subject" id="105"> Computer Science
            </label>
            <label for="english">
                <input type="checkbox" value="english" name="subject" id="106"> English
            </label>
            <br>
            <br>
            State:
            <select name="state">
                <option value=" " >Choose a state</option>
                <option value="Up">Uttarpradesh</option>
                <option value="Delhi">Delhi</option>
                <option value="Rajasthan">Rajasthan</option>
                <option value="Uk">Uttrakhand</option>
                <option value="Mahrashtra">Mahrashtra</option>
                <option value="Punjab">Punjab</option>
                <option value="Haryana">Haryana</option>
                <option value="Bihar">Bihar</option>
                <option value="Gujarat">Gujarat</option>
                <option value="West Bengal">West Bengal</option>
                <option value="Tamil Nadu">Tamil Nadu</option>
                <option value="Assam">Assam</option>
                <option value="Other">Other</option>


            </select>
            <br>
            <br>
            City:
            <select name="city">
                <option value=" ">Choose a city</option>
                <option value="Lucknow">Lucknow</option>
                <option value="Delhi">Delhi</option>
                <option value="Mumbai">Mumbai</option>
                <option value="Kolkata">Kolkata</option>
                <option value="Chennai">Chennai</option>
                <option value="Bengaluru">Bengaluru</option>
                <option value="Hyderabad">Hyderabad</option>
                <option value="Pune">Pune</option>
                <option value="Jaipur">Jaipur</option>
                <option value="Ahmedabad">Ahmedabad</option>
                <option value="Chandigarh">Chandigarh</option>
                <option value="Kanpur">Kanpur</option>
                <option value="Varansi">Varansi</option>
                <option value="Agra">Agra</option>
                <option value="Other">Other</option>
            </select>
            <br>
            <br>
            Address:
            <textarea name="address" id="address" placeholder="Permanent address"></textarea>
            <br>
            <br>
            Upload profile photo:
            <input type="file" value="file">
            <br>
            <br>
            Favorite color:
            <input type="color" value="color">
            <br>
            <br>
            Favorite country: 
            <select name="Fav Country: ">
                <option value="Uk">UK</option>
                <option value="Korea">Korea</option>
                <option value="Japan">Japan</option>
                <option value="Netherlands">Netherlands</option>
                <option value="Pakistan">Pakistan</option>
            </select>
            <br>
            <br>
            <div>
                <label for="country">Select a country: </label>
                <input type="text" id="country" name="country" list="countries" />
                <datalist id="countries">
                    <option value="Uk">UK</option>
                    <option value="Korea">Korea</option>
                    <option value="Japan">Japan</option>
                    <option value="Netherlands">Netherlands</option>
                    <option value="Pakistan">Pakistan</option> 
                </datalist>
            </div>
            Hobbies:
            <label for="Reading">
                <input type="checkbox" value="Reading" name="Hobbies" id="Reading"> Reading
            </label>
            <label for="Gaming">
                <input type="checkbox" value="Gaming" name="Hobbies" id="Gaming"> Gaming
            </label>
            <label for="Sports">
                <input type="checkbox" value="Sports" name="Hobbies" id="Sports"> Sports
            </label>
            <label for="Music">
                <input type="checkbox" value="Music" name="Hobbies" id="Music"> Music
            </label>
            <label for="Other">
                <input type="checkbox" value="Other" name="Hobbies" id="Other"> Other
            </label>
            <br>
            <br>

            <label for="email">Enter your email: </label>
            <input type="email" placeholder="enter your email" name="email" required autocomplete="off"
            size="15"
            value="thapatech@gmail.com"
            readonly
            disabled/>


            Satisfaction level:
            <input type="range" value="range">
            <br>
            <br>
            Search:
            <input type="search" value="search">
            <br>
            <br>
            <input type="submit" value="submit">
            <!-- OR -->
            <button type="submit">Submit</button>
            <input type="reset" value="reset">
            <br>
            <br>
            <h5>Feedback</h5>
            <textarea name="feedback" id="feedback" placeholder="Please provide feedback here!" ></textarea>
            <br>
            <br>
            <img src="./anime.jfif" alt="THANK YOU "/>


        </form>
    </body>
</html>
